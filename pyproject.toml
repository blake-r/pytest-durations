[tool.poetry]
name = "pytest-durations"
version = "1.10.0"
description = "Pytest plugin reporting fixtures and test functions execution time."
authors = ["Oleg Blednov <oleg.codev@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/blake-r/pytest-durations"
repository = "https://github.com/blake-r/pytest-durations"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Pytest",
]
include = ["LICENSE"]

[tool.poetry.plugins."pytest11"]
pytest-durations = "pytest_durations"

[tool.poetry.dependencies]
pytest = [
    { version = ">=7.0", python = "<3.13" },
    { version = ">=8.4", python = ">=3.13,<3.15" },
    { version = ">=9.1", python = ">=3.15" },
]
python = ">=3.11,<4.0"

[tool.poetry.group.dev.dependencies]
freezegun = "^1.5.5"
pre-commit = "^4.6.2"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-xdist = "^3.8.0"
ruff = "^0.17.2"
typos = "^1.51.1"
time-machine = "^3.5.1"
virtualenv = "^21.14.13"

[tool.poetry.group.sync.dependencies]
poetry = "^2.5.1"
setuptools = "*"
wheel = "*"
zstandard = "^0.25"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
