name: cicd
on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review]
  release:
    types: [ published ]

env:
  python-version-latest: "3.14"

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.python-version-latest }}
      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
      - name: Prepare artefacts
        run: |
          pip install --no-cache-dir -U pip
          pip install --no-cache-dir -U "poetry==2.3.*"
          poetry install --no-root
      - name: Run linters
        run: pre-commit run --all-files

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
      - name: Prepare artefacts
        run: |
          pip install --no-cache-dir -U pip
          pip install --no-cache-dir -U "poetry==2.3.*"
          poetry install --no-root
          poetry build
          pip install --no-cache-dir -U dist/*.whl
      - name: Verify wheel
        run: |
          python -c "import pytest_durations; print(pytest_durations.__version__)"
          python -m pytest --co -q
      - name: Run tests
        run: pytest --showlocals -vv --cov
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags') && matrix.python-version == env.python-version-latest
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/

  cd:
    # https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
    needs: [ ci ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for Trusted Publishing to PyPI via OIDC
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ env.python-version-latest }}
          path: dist/
      - name: Publish distribution 📦 to Test PyPI
        if: github.event.release.prerelease == true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TESTPYPI_API_TOKEN }}
          repository_url: https://test.pypi.org/legacy/
      - name: Publish distribution 📦 to PyPI
        if: github.event.release.prerelease == false
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing via OIDC — no token required
